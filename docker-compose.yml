
services:
  db:
    image: postgres:15-alpine
    container_name: scanner_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepassword123
      - POSTGRES_DB=security_scanner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_scanner"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - backend_internal
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: scanner_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - backend_internal
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build: .
    container_name: scanner_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/security_scanner
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_internal
      - public_network
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    build: .
    container_name: scanner_worker
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/security_scanner
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "worker_health.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_internal
      - public_network
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  backend_internal:
    internal: true
  public_network:
    driver: bridge

volumes:
  postgres_data: